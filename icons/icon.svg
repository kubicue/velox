<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <!-- Bauhaus Canvas Background -->
  <rect width="500" height="700" fill="#f4f4f0" />

  <!-- Bauhaus Book Typography Header -->
  <text x="240" y="95" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="64" fill="#121212" letter-spacing="-2">velox</text>
  <text x="242" y="125" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#121212" letter-spacing="0">shipping station</text>
  <text x="375" y="125" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#121212" letter-spacing="0">zero framework</text>

  <!-- Left Blue Column -->
  <rect x="0" y="0" width="90" height="595" fill="#0050aa" />

  <!-- Yellow Horizontal Bar -->
  <rect x="90" y="185" width="380" height="105" fill="#fed100" />

  <!-- Central Black Field -->
  <rect x="90" y="290" width="300" height="305" fill="#121212" />

  <!-- Right Red Column -->
  <rect x="390" y="290" width="80" height="305" fill="#df2828" />

  <!-- Bottom Gray Horizontal Bar -->
  <rect x="0" y="595" width="390" height="105" fill="#9e9e9e" />

  <!-- Central Black Box Typography -->
  <text x="240" y="430" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="2">4×6″</text>
  <text x="240" y="470" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="2">LABEL</text>
</svg>
