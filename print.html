<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print Shipping Label — Velox</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/print.css">
  <style>
    .print-screen-bar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: var(--space-4) var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 800px;
      margin: 0 auto var(--space-6) auto;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .print-canvas-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--space-6);
    }
  </style>
</head>
<body style="background-color: var(--bg-app);">

  <!-- Screen Navigation Bar (Hidden when printing via print.css) -->
  <div class="print-screen-bar no-print" style="margin-top: var(--space-6);">
    <div>
      <a href="index.html" style="font-weight: 600; text-decoration: none;">&larr; Back to Dashboard</a>
      <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 2px;">
        Formatted for standard 4" × 6" thermal printers (or 8.5" × 11" paper).
      </div>
    </div>
    <div style="display: flex; gap: var(--space-2);">
      <a href="ship.html" class="btn btn-secondary btn-sm" style="padding: 0.5rem 1rem; border: 1px solid #ccc; border-radius: 4px; text-decoration: none; color: inherit;">+ New Label</a>
      <button id="trigger-print-btn" class="btn btn-primary" style="padding: 0.5rem 1.25rem; background: #1e3a8a; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
        🖨️ Print Label
      </button>
    </div>
  </div>

  <!-- Thermal Label Container -->
  <main class="print-canvas-wrapper">
    <div id="print-mount" class="print-page">
      <shipping-label id="target-label"></shipping-label>
    </div>
  </main>

  <!-- Scripts -->
  <script type="module">
    import { db } from "./js/db.js";
    import "./js/components/shipping-label.js";

    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const labelId = urlParams.get("id");
      const autoPrint = urlParams.get("autoprint") === "1";
      const targetLabel = document.getElementById("target-label");

      if (labelId) {
        const shipment = await db.getShipment(labelId);
        if (shipment) {
          targetLabel.shipment = shipment;
        } else {
          console.warn("Shipment ID not found in local IndexedDB; showing default label.");
        }
      }

      document.getElementById("trigger-print-btn").addEventListener("click", () => {
        window.print();
      });

      if (autoPrint) {
        // Small delay to ensure Web Component SVG barcode is fully painted
        setTimeout(() => {
          window.print();
        }, 350);
      }
    });
  </script>
</body>
</html>
