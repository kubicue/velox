<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Shipment — Velox</title>
  <meta name="description" content="Track carrier packages and view milestone timelines with native web primitives.">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-container">
      <a href="index.html" class="brand-link">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        VELOX
        <span class="brand-badge">Primitives</span>
      </a>

      <nav class="main-nav" aria-label="Main Navigation">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="ship.html" class="nav-link">New Shipment</a>
        <a href="track.html" class="nav-link active">Track</a>
      </nav>

      <div class="header-actions">
        <button id="theme-toggle-btn" class="btn btn-secondary btn-sm">🌓 Theme</button>
      </div>
    </div>
  </header>

  <!-- Main Tracking Container -->
  <main class="app-main">
    <header class="page-header">
      <div>
        <h1 class="page-title">Package Tracking</h1>
        <p class="page-subtitle">Inspect real-time shipment status, routing checkpoints, and estimated delivery dates.</p>
      </div>
    </header>

    <!-- Tracking Input Bar -->
    <section class="card" style="margin-bottom: var(--space-8);">
      <form id="track-form" style="display: flex; gap: var(--space-3); flex-wrap: wrap;">
        <div style="flex: 1; min-width: 280px;">
          <input
            type="text"
            id="tracking-number-input"
            class="form-control"
            placeholder="Enter 22-digit USPS Tracking # (e.g. 9400 1118 9956 2537 6382 12)"
            required
            style="font-family: var(--font-mono); font-size: 1.05rem;"
          >
        </div>
        <button type="submit" class="btn btn-primary btn-lg">
          🔍 Track Package
        </button>
      </form>
    </section>

    <!-- Tracking Results Area -->
    <section id="tracking-display-area">
      <track-stepper id="tracker-component"></track-stepper>
    </section>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="footer-container">
      <div>Velox — Native Tracking Primitive</div>
      <div>Replaced legacy AfterShip iframe with native Web Component</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module">
    import { initAppShell } from "./js/app.js";
    import { getTrackingStatus } from "./js/shippo-engine.js";
    import "./js/components/track-stepper.js";

    document.addEventListener("DOMContentLoaded", async () => {
      await initAppShell();

      const urlParams = new URLSearchParams(window.location.search);
      const trackingParam = urlParams.get("number");
      const input = document.getElementById("tracking-number-input");
      const form = document.getElementById("track-form");
      const stepper = document.getElementById("tracker-component");

      if (trackingParam) {
        input.value = trackingParam;
        runTracking(trackingParam);
      } else {
        // Run with demo default
        const defaultNum = "9400 1118 9956 2537 6382 12";
        input.value = defaultNum;
        runTracking(defaultNum);
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const num = input.value.trim();
        if (num) {
          runTracking(num);
          // Update URL without reloading page
          const newUrl = `${window.location.pathname}?number=${encodeURIComponent(num)}`;
          window.history.pushState({ path: newUrl }, "", newUrl);
        }
      });

      async function runTracking(num) {
        const trackingData = await getTrackingStatus(num);
        stepper.trackingData = trackingData;
      }
    });
  </script>
</body>
</html>
